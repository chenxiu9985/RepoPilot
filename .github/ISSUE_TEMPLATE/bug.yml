name: Bug report
description: 可复现的缺陷
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小示例和执行命令；请移除密钥、私人代码及敏感日志。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为与实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Python 版本、RepoPilot 版本或提交。
    validations:
      required: true
